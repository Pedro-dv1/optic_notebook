    <title>NoteSync</title>
    <style>
      html[data-brand-intro="play"] { overflow: hidden; }
      #brand-intro { display: none; }
      html[data-brand-intro="play"] #brand-intro {
        position: fixed; inset: 0; z-index: 2147483647; display: grid; place-items: center;
        overflow: hidden; background: #fff;
      }
      #brand-intro-lockup { display: grid; justify-items: center; gap: 0; }
      #brand-intro-symbol { width: min(15rem, 52vw, 32vh); height: auto; overflow: visible; }
      #marker { transform-box: fill-box; transform-origin: center; transform: scale(0); }
      #symbol-draw-guide { stroke-dasharray: 9999; stroke-dashoffset: 9999; }
      #brand-intro-wordmark { width: min(32rem, 88vw); height: min(5rem, 14vw); margin-top: -2rem; margin-left: -14%; object-fit: cover; object-position: center; opacity: 0; transform: translateY(1rem); clip-path: inset(0 0 0 28%); }
      #brand-iris-defs { position: absolute; width: 0; height: 0; overflow: hidden; }
      @media (prefers-reduced-motion: reduce) { #brand-intro { display: none !important; } }
    </style>
    <script>
      try {
        const seenIntro = sessionStorage.getItem('notesync-brand-intro-seen') || sessionStorage.getItem('optic-brand-intro-seen');
        if (seenIntro) { sessionStorage.setItem('notesync-brand-intro-seen', '1'); sessionStorage.removeItem('optic-brand-intro-seen'); }
        if (location.pathname === '/' && !matchMedia('(prefers-reduced-motion: reduce)').matches && !seenIntro) {
          document.documentElement.dataset.brandIntro = 'play';
          setTimeout(() => {
            if (document.documentElement.dataset.brandIntro === 'play') {
              document.documentElement.dataset.brandIntro = 'done';
              document.getElementById('brand-intro')?.remove();
              try { sessionStorage.setItem('notesync-brand-intro-seen', '1'); } catch {}
              window.dispatchEvent(new Event('app:preloader-done'));
            }
          }, 8000);
        }
      } catch { /* Storage can be disabled; the app still loads. */ }
    </script>
  </head>
